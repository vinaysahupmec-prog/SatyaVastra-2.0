<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="svGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#421217"/>
      <stop offset="50%" stop-color="#641f25"/>
      <stop offset="100%" stop-color="#191412"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#svGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8"/>
  <!-- Traditional Odisha Ikat Diamond Motif Pattern -->
  <g transform="translate(256, 210) scale(1.1)">
    <path d="M 0 -110 L 110 0 L 0 110 L -110 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>
    <path d="M 0 -80 L 80 0 L 0 80 L -80 0 Z" fill="rgba(180, 83, 9, 0.25)" stroke="#fef08a" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="#fef08a"/>
    <circle cx="0" cy="0" r="14" fill="#641f25"/>
    <!-- Bandha feathered micro teeth -->
    <path d="M -90 -10 L -110 0 L -90 10 M 90 -10 L 110 0 L 90 10 M -10 -90 L 0 -110 L 10 -90 M -10 90 L 0 110 L 10 90" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="256" y="385" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="64" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="4">SATYAVASTRA</text>
  <text x="256" y="430" font-family="'Noto Serif Oriya', sans-serif" font-size="28" font-weight="600" fill="#fef08a" text-anchor="middle" opacity="0.9">ସତ୍ୟବସ୍ତ୍ର · CRAFT PASSPORT</text>
</svg>
